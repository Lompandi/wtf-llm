; Pytest configuration.
;
; WITHOUT THIS FILE, a bare `pytest` in the repo root is broken: it walks into
; `src/libs/kdmp-parser/src/python/tests/` -- vendored upstream tests that import
; `kdmp_parser`, a module this project never installs -- and dies with
; "Interrupted: 3 errors during collection" before running anything of ours.
;
; Every command in this project's own docs said `pytest tests/gates`, so the
; failure was invisible to us and immediate for anyone else (D-066). The fix is
; `testpaths`, and `norecursedirs` in addition because an explicit path argument
; overrides testpaths and would walk into src/ again.

[pytest]
testpaths = tests

norecursedirs =
    src
    linux_mode
    third_party
    .venv
    .git
    artifacts
    targets
    logs

; RULE 3 says a gate proves interfaces are ACTUALLY WIRED, not that code
; compiles. These markers separate the assertions that can prove that from the
; ones that cannot, because "473 passed" says nothing about which kind ran.
;
; `tools/gates.py` uses them: in strict mode a REQUIRED assertion that skips
; fails the gate instead, which is what stops a green suite standing in for a
; gate nobody satisfied.
markers =
    integration: needs external tools or run-time artifacts (Ghidra, wtf.exe, a snapshot)
    live: needs a live external service (LLM endpoint, GhidraMCP)
    campaign: needs a real fuzzing campaign, minutes to hours
    evidence: asserts against a recorded run's artifacts rather than a fixture
    required: a gate condition from CLAUDE.md section 8 -- skipping it makes the gate INCOMPLETE

; Show skip reasons by default. A skipped gate condition that prints nothing is
; how "12 skipped" came to hide the one criterion GATE 7 does not meet.
addopts = -ra
